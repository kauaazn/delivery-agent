[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-agent"
version = "0.1.0"
description = "A conversational AI agent for food-delivery orders, built on Claude tool use."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
delivery-agent = "delivery_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
